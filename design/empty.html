.ewrap{display:flex;flex-direction:column;align-items:center;

.art{width:100%;text-align:center;margin-bottom:8px}
.art .num{font-size:96px;line-height:96px;font-weight:700;letter-spacing:-6px;

.ewrap h2{font-size:18px;font-weight:400;margin:0 0 6px;letter-spacing:0}
.ewrap p{font-size:13px;color:var(--color-muted);line-height:1.7;margin:0 0 16px}
.ewrap .btn{width:auto;padding:0 24px;border-radius:14px;font-size:14px;font-weight:500}
.ewrap .endline{width:100%;height:1px;background:var(--color-line);margin-top:20px}
.clip{margin-top:0!important;border-top:0!important;border-bottom:1px solid var(--color-line)!important;border-radius:0!important;background:transparent!important;padding:10px 0!important;max-width:none!important}
.clip .cl{font-size:12px;color:var(--color-muted);font-weight:400}
.clip .cb{font-size:14px;color:var(--color-text);margin:4px 0 0;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clip .ca{font-size:12px;color:var(--color-muted);margin-top:4px}
</style>
